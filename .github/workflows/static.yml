name: Deploy TEa.G3 Web Studio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/static.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate web application
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/manifest.json
          test -s web/sw.js
          node --check web/app.js
          node --check web/sw.js
          python -m json.tool web/manifest.json >/dev/null
          grep -q 'lang="ar" dir="rtl"' web/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web application
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
